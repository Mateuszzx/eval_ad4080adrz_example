CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ADC_LOG_LEVEL_INF=y

# Idle is WFI. Without this, STM32F4 drops the debug clock in sleep and
# OpenOCD cannot halt the core for the next flash.
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

CONFIG_MEMC=y
CONFIG_MEMC_LOG_LEVEL_ERR=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=y
